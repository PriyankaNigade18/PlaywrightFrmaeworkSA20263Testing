name: Playwright WorkFlow Email

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - stage
          - dev

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ============================================================
  # 1. RUN PLAYWRIGHT TESTS + GENERATE ALLURE REPORT
  # ============================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # ----------------------------------------------------------
      # RUN TESTS
      # ----------------------------------------------------------
      - name: Run UI tests
        run: npx playwright test --project=ui
        env:
          ENV: ${{ github.event.inputs.environment || 'qa' }}
          APP_URL: ${{ secrets.APP_URL }}
          APPUSERNAME: ${{ secrets.APPUSERNAME }}
          APPPASSWORD: ${{ secrets.APPPASSWORD }}
          API_URL: ${{ secrets.API_URL }}
          ACCESSTOKEN: ${{ secrets.ACCESSTOKEN }}

      # ----------------------------------------------------------
      # PLAYWRIGHT HTML REPORT
      # ----------------------------------------------------------
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html-report/
          retention-days: 30

      # ----------------------------------------------------------
      # GENERATE ALLURE
      # ----------------------------------------------------------
      - name: Generate Allure Report
        if: always()
        run: |
          npx allure generate allure-results -o allure-report --clean

      # ----------------------------------------------------------
      # CUSTOMIZE ALLURE
      # ----------------------------------------------------------
      - name: Customize Allure
        if: always()
        run: |
          node src/allure/customize-allure-report.js

      # ----------------------------------------------------------
      # UPLOAD ALLURE REPORT AS DOWNLOADABLE ARTIFACT
      # ----------------------------------------------------------
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # ----------------------------------------------------------
      # SAVE ALLURE REPORT FOR DEPLOY JOB
      # ----------------------------------------------------------
      - name: Upload Allure Pages Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-pages-files
          path: allure-report/
          retention-days: 1


  # ============================================================
  # 2. DEPLOY ALLURE TO GITHUB PAGES
  # ============================================================
  deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:

      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-pages-files
          path: allure-report

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display Allure Report URL
        run: |
          echo "======================================"
          echo "Allure Report:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "======================================"


  # ============================================================
  # 3. SEND EMAIL
  # ============================================================
  email:
    needs: deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send Allure Report Email
        run: |
          npx tsx src/email/send-report-email.ts
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          ALLURE_REPORT_URL: https://priyankanigade18.github.io/PlaywrightFrmaeworkSA20263Testing/
          STUDENT_EMAILS: ${{ secrets.STUDENT_EMAILS }}